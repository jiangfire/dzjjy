name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.9"
  GOCACHE: ${{ github.workspace }}/.gocache

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate tag format
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 5m

      - name: Run tests
        run: go test -race ./...

      - name: Run govulncheck
        run: |
          # Pinned (not @latest), matching CI, so the scanner version stays
          # reproducible; v1.8+ requires Go >= 1.26, satisfied above.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Run gosec
        run: |
          # Keep in sync with CI: G703 (taint-based path traversal) is excluded
          # because user input reaching file paths is gated by validateAppName /
          # safeExtractPath / filepath.Rel containment checks that taint analysis
          # cannot track; traversal behavior is covered by dedicated tests in
          # archive/staticserve/handler.
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G703 ./...

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Compute release metadata
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *"-"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Build release artifacts
        run: |
          make release
          make checksum
          make package

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          retention-days: 7

      - name: Publish release summary
        run: |
          echo "## Release Artifacts" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/ >> $GITHUB_STEP_SUMMARY

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: ${{ needs.build-release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## dzjjy ${{ github.ref_name }}

            轻量级部署与进程管理工具，面向开发与测试环境。

            ### 包含内容
            - 多平台服务端与客户端二进制
            - `checksums.txt`
            - 打包压缩文件

            ### 文档
            - README: https://github.com/${{ github.repository }}/blob/main/README.md
            - Architecture: https://github.com/${{ github.repository }}/blob/main/docs/ARCHITECTURE.md
            - Release Guide: https://github.com/${{ github.repository }}/blob/main/docs/RELEASE.md
