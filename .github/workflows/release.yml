# Release Workflow - 自动构建发布包和创建 GitHub Release
name: Release

on:
  push:
    tags:
      - 'v*'
      - 'v*.*'
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Extract version info
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Build version: $VERSION"

    - name: Display build info
      run: |
        echo "Building version: ${{ steps.version.outputs.version }}"
        echo "Git commit: ${{ github.sha }}"
        echo "Repository: ${{ github.repository }}"

    - name: Download dependencies
      run: make deps

    - name: Run tests
      run: make test

    - name: Build release binaries
      run: make release

    - name: Generate checksums
      run: make checksum

    - name: Create archives
      run: make package

    - name: List release artifacts
      run: |
        echo "## Release Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        ls -lh dist/ >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### File sizes" >> $GITHUB_STEP_SUMMARY
        du -sh dist/* >> $GITHUB_STEP_SUMMARY

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body: |
          ## Release ${{ github.ref_name }}

          ### Changes
          - Automatic release build
          - Multi-platform support

          ### Binaries
          - Server: dzjjy-server-{platform}-{arch}
          - Client: dzjjy-client-{platform}-{arch}

          ### Platforms Supported
          - Linux (amd64, arm64)
          - macOS (amd64, arm64)
          - Windows (amd64)

          ### Installation
          ```bash
          # Download and extract
          tar -xzf dzjjy-server-linux-amd64.tar.gz

          # Make executable
          chmod +x dzjjy-server

          # Run
          ./dzjjy-server -token your-token -port 8080
          ```

          ### Verification
          Checksums are provided in `checksums.txt` for verification.

          ---
          *Generated by GitHub Actions*
        draft: false
        prerelease: false

    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/checksums.txt
        asset_name: checksums.txt
        asset_content_type: text/plain

    - name: Upload server binaries
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/dzjjy-server-linux-amd64.tar.gz
        asset_name: dzjjy-server-linux-amd64.tar.gz
        asset_content_type: application/gzip

    - name: Upload client binaries
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/dzjjy-client-linux-amd64.tar.gz
        asset_name: dzjjy-client-linux-amd64.tar.gz
        asset_content_type: application/gzip

    - name: Upload all platform binaries
      run: |
        for file in dist/*.tar.gz; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            echo "Uploading $filename"
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/gzip" \
              --data-binary @"$file" \
              "${{ steps.create_release.outputs.upload_url }}?name=$filename"
          fi
        done

    - name: Upload all platform binaries (alternative)
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*
        draft: false
        prerelease: false
        body: |
          ## Release ${{ github.ref_name }}

          Multi-platform binaries for dzjjy deployment service.

          ### Quick Start
          ```bash
          # Extract the binary for your platform
          tar -xzf dzjjy-server-linux-amd64.tar.gz

          # Run server
          ./dzjjy-server -token your-token -port 8080 -state ./state.json

          # Deploy client
          ./dzjjy-client deploy -server http://localhost:8080 -token your-token \
            -file app.zip -type runtime -executable python3 -entry app.py
          ```

          ### Files
          - Checksums: checksums.txt
          - Server binaries: dzjjy-server-{platform}-{arch}(.tar.gz)
          - Client binaries: dzjjy-client-{platform}-{arch}(.tar.gz)

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: release
    if: always()

    steps:
    - name: Release Summary
      run: |
        echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Version: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Download Links" >> $GITHUB_STEP_SUMMARY
        echo "Visit the [release page](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Available Platforms" >> $GITHUB_STEP_SUMMARY
        echo "- Linux (amd64, arm64)" >> $GITHUB_STEP_SUMMARY
        echo "- macOS (amd64, arm64)" >> $GITHUB_STEP_SUMMARY
        echo "- Windows (amd64)" >> $GITHUB_STEP_SUMMARY