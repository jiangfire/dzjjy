# Release Workflow - 自动构建发布包和创建 GitHub Release
name: Release

on:
  push:
    tags:
      - 'v*'
      - 'v*.*'
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Extract version info
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Build version: $VERSION"

    - name: Display build info
      run: |
        echo "Building version: ${{ steps.version.outputs.version }}"
        echo "Git commit: ${{ github.sha }}"
        echo "Repository: ${{ github.repository }}"

    - name: Download dependencies
      run: make deps

    - name: Run tests
      run: make test

    - name: Build release binaries
      run: make release

    - name: Generate checksums
      run: make checksum

    - name: Create archives
      run: make package

    - name: List release artifacts
      run: |
        echo "## Release Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        ls -lh dist/ >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### File sizes" >> $GITHUB_STEP_SUMMARY
        du -sh dist/* >> $GITHUB_STEP_SUMMARY

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## dzjjy ${{ github.ref_name }}

          轻量级进程管理和部署工具，专为开发环境设计。

          ### 📦 安装

          下载适合你平台的二进制文件：

          ```bash
          # Linux/macOS
          tar -xzf dzjjy-server-linux-amd64.tar.gz
          chmod +x dzjjy-server dzjjy-client

          # Windows
          # 解压 dzjjy-server-windows-amd64.tar.gz
          ```

          ### 🚀 快速开始

          ```bash
          # 启动服务端
          ./dzjjy-server -token your-secret-token -port 8080 -state ./state.json

          # 部署应用
          ./dzjjy-client deploy \
            -server http://localhost:8080 \
            -token your-secret-token \
            -file app.zip \
            -type runtime \
            -executable python3 \
            -entry app.py \
            -auto-restart
          ```

          ### 📋 支持的平台

          - Linux (amd64, arm64)
          - macOS (amd64, arm64)
          - Windows (amd64)

          ### 🔐 校验和

          使用 `checksums.txt` 验证下载文件的完整性：

          ```bash
          sha256sum -c checksums.txt
          ```

          ### 📚 文档

          - [README](https://github.com/jiangfire/dzjjy#readme)
          - [架构设计](https://github.com/jiangfire/dzjjy/blob/main/docs/ARCHITECTURE.md)
          - [开发指南](https://github.com/jiangfire/dzjjy/blob/main/docs/DEVELOPMENT.md)

          ---

          **完整更新日志**: https://github.com/jiangfire/dzjjy/blob/${{ github.ref_name }}/CHANGELOG.md

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: release
    if: always()

    steps:
    - name: Release Summary
      run: |
        echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Version: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Download Links" >> $GITHUB_STEP_SUMMARY
        echo "Visit the [release page](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Available Platforms" >> $GITHUB_STEP_SUMMARY
        echo "- Linux (amd64, arm64)" >> $GITHUB_STEP_SUMMARY
        echo "- macOS (amd64, arm64)" >> $GITHUB_STEP_SUMMARY
        echo "- Windows (amd64)" >> $GITHUB_STEP_SUMMARY