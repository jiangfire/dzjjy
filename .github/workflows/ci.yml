name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.8"
  GOCACHE: ${{ github.workspace }}/.gocache

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 5m

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

      - name: Build binaries
        run: |
          go build -o build/dzjjy-server ./cmd/server
          go build -o build/dzjjy-client ./cmd/client

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-out
          path: coverage.out
          retention-days: 7

  cross-platform-build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build server and client
        run: |
          go build -o build/dzjjy-server ./cmd/server
          go build -o build/dzjjy-client ./cmd/client

      - name: Smoke check binaries
        shell: bash
        run: |
          ls -la build/
          if [ -f "build/dzjjy-server.exe" ]; then
            ./build/dzjjy-server.exe -h >/dev/null || true
            ./build/dzjjy-client.exe -h >/dev/null || true
          else
            chmod +x build/dzjjy-server build/dzjjy-client
            ./build/dzjjy-server -h >/dev/null || true
            ./build/dzjjy-client -h >/dev/null || true
          fi
