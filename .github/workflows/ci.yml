name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.9"
  GOCACHE: ${{ github.workspace }}/.gocache

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 5m

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Run govulncheck
        run: |
          # Pinned (not @latest) so the scanner version stays reproducible;
          # v1.8+ requires Go >= 1.26, satisfied by the toolchain above.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Run gosec
        run: |
          # G703 (taint-based path traversal) excluded: user input reaching file
          # paths is gated by validateAppName / safeExtractPath / filepath.Rel
          # containment checks that taint analysis cannot track; traversal
          # behavior is covered by dedicated tests in archive/staticserve/handler.
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G703 ./...

      - name: Build binaries
        run: |
          go build -o build/dzjjy-server ./cmd/server
          go build -o build/dzjjy-client ./cmd/client

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-out
          path: coverage.out
          retention-days: 7

  docker-e2e:
    name: Docker E2E (real daemon)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Real-daemon E2E for the Docker backend: managed lifecycle for every
      # runtime template (pull/create/start/logs/stop/remove), stop-timeout
      # kill fallback, unlabelled-container ownership guard, and restart
      # recovery. Excluded from the main test run via the docker_e2e build tag
      # because it pulls template images and takes minutes.
      - name: Run Docker E2E
        run: go test -tags=docker_e2e -timeout 20m -v -run 'TestE2E' ./internal/server/dockerbackend/...

  gvisor-e2e:
    name: gVisor E2E (runsc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Install gVisor's runsc and register it with the Docker daemon, then
      # exercise the Phase 3 isolator path against a real container. The tests
      # skip themselves when runsc is absent, so this job failing means gVisor
      # broke rather than silently losing coverage.
      - name: Install gVisor runsc
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64) GV_ARCH=amd64 ;;
            aarch64) GV_ARCH=arm64 ;;
            *) echo "unsupported runner architecture ${ARCH}"; exit 1 ;;
          esac
          curl -fsSL -o /tmp/runsc "https://storage.googleapis.com/gvisor/releases/release/latest/${GV_ARCH}/runsc"
          curl -fsSL -o /tmp/containerd-shim-runsc-v1 "https://storage.googleapis.com/gvisor/releases/release/latest/${GV_ARCH}/containerd-shim-runsc-v1"
          sudo install -m 0755 /tmp/runsc /usr/local/bin/runsc
          sudo install -m 0755 /tmp/containerd-shim-runsc-v1 /usr/local/bin/containerd-shim-runsc-v1
          sudo tee /etc/docker/daemon.json > /dev/null <<'JSON'
          {
            "runtimes": {
              "runsc": {
                "path": "/usr/local/bin/runsc"
              }
            }
          }
          JSON
          sudo systemctl restart docker
          for _ in $(seq 1 30); do
            if docker info --format '{{json .Runtimes}}' | grep -q runsc; then
              echo "runsc runtime registered"
              docker info --format '{{json .Runtimes}}'
              exit 0
            fi
            sleep 2
          done
          echo "runsc runtime was not registered in time" >&2
          docker info --format '{{json .Runtimes}}' >&2 || true
          exit 1

      - name: Run gVisor E2E
        run: go test -tags=docker_e2e -timeout 25m -v -run 'TestE2EIsolator|TestE2EResourceLimit' ./internal/server/dockerbackend/...

      - name: Report effective runtime (debug)
        if: always()
        run: docker info --format '{{json .Runtimes}}'

  cross-platform-build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build server and client
        run: |
          go build -o build/dzjjy-server ./cmd/server
          go build -o build/dzjjy-client ./cmd/client

      - name: Smoke check binaries
        shell: bash
        run: |
          ls -la build/
          if [ -f "build/dzjjy-server.exe" ]; then
            ./build/dzjjy-server.exe -h >/dev/null || true
            ./build/dzjjy-client.exe -h >/dev/null || true
          else
            chmod +x build/dzjjy-server build/dzjjy-client
            ./build/dzjjy-server -h >/dev/null || true
            ./build/dzjjy-client -h >/dev/null || true
          fi
